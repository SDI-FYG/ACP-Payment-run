<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ACP Payment Run</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
:root{--paper:#F3F5F8;--sheet:#FFFFFF;--ink:#141C2E;--muted:#5B6578;--rule:#DCE1EA;--navy:#1F3864;--navy-ink:#FFFFFF;--focus:#3D6BC4;--bad:#B42318;--bad-bg:#FDECEA;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace}
@media (prefers-color-scheme: dark){:root{--paper:#0F1420;--sheet:#171E2D;--ink:#E6EAF2;--muted:#9AA4B8;--rule:#2A3346;--navy:#7EA2E6;--navy-ink:#0F1420;--focus:#9DB9F0;--bad:#F08A80;--bad-bg:#3A1C1A;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;display:grid;place-items:center;padding:24px 16px}
form{width:100%;max-width:360px;background:var(--sheet);border:1px solid var(--rule);border-top:4px solid var(--navy);border-radius:8px;padding:28px 24px;display:grid;gap:16px}
h1{margin:0;font-size:24px;letter-spacing:-.01em}
p{margin:0;color:var(--muted);font-size:14px}
label{display:grid;gap:6px;font-size:14px;font-weight:600}
input{font:inherit;font-weight:400;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button{font:inherit;font-weight:600;background:var(--navy);color:var(--navy-ink);border:0;border-radius:6px;padding:12px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{background:var(--bad-bg);color:var(--bad);padding:10px 12px;border-radius:6px;font-size:14px}
.small{font-size:12px}
</style>
</head>
<body>
<form id="login" autocomplete="on">
  <div>
    <h1>ACP Payment Run</h1>
    <p>Sign in to open the payment run tool.</p>
  </div>
  <label for="acc">Account
    <input id="acc" name="username" autocomplete="username" required autofocus>
  </label>
  <label for="pw">Password
    <input id="pw" name="password" type="password" autocomplete="current-password" required>
  </label>
  <div class="err" id="err" hidden></div>
  <button type="submit" id="go">Sign in</button>
  <p class="small">Stays signed in until this browser tab is closed.</p>
</form>

(function () {
  "use strict";
  var KEY_STORE = "acp-session-key";
  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function tob64(buf) { var s = "", a = new Uint8Array(buf); for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }

  function read(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }

  async function deriveKey(acc, pw) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey("raw", enc.encode(acc.trim().toUpperCase() + ":" + pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  async function openWith(key) {

    var raw = read(KEY_STORE);

      launch(await openWith(key)); return true;

  if (!window.crypto || !crypto.subtle) {

    err.hidden = false; go.disabled = true;
  } else {
    tryStored();
  }
  form.addEventListener("submit", async function (e) {

    err.hidden = true; go.disabled = true; go.textContent = "Signing in…";
